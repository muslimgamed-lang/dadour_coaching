<style>
/* Layout: dark hero with a giant outlined name and an offer card, orange ticker, plans, before/after slider, follow strip, join form. English and Arabic (right to left). */
:root {
  --bg: #F1F4F0;
  --surface: #FFFFFF;

    --ph-a: #1E2C26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1210; --surface: #141F1B; --ink: #EDF3EF; --muted: #9FB2AA; --line: #24352E;
  --accent: #FF6A3D; --accent-ink: #1A0A06; --deep: #07100D; --deep-ink: #EDF3EF; --deep-muted: #8FA59B;
  --ph-a: #1E2C26; color-scheme: dark;
}
:root[dir="rtl"] {
  --font-display: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  --font-body: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  --font-mono: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
}
:root[dir="rtl"] *, :root[dir="rtl"] *::before, :root[dir="rtl"] *::after { letter-spacing: 0 !important; }
:root[dir="rtl"] h1, :root[dir="rtl"] h2, :root[dir="rtl"] h3 { line-height: 1.25; font-weight: 900; }
:root[dir="rtl"] .hero h1 { font-size: clamp(46px, 8.4vw, 100px); line-height: 1.12; }

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; margin: 0; }

a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1160px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 1; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.band-deep { background: var(--deep); color: var(--deep-ink); --accent: #FF6A3D; --accent-ink: #1A0A06; --line: var(--deep-line); --muted: var(--deep-muted); --ink: var(--deep-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px/1.1 var(--font-body); padding: 16px 24px; border-radius: 6px; border: 2px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer; transition: transform .15s ease, background .15s ease; text-align: center; }

/* Hero */
.hero { position: relative; overflow: hidden; padding-bottom: 72px; }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 8px; background: repeating-linear-gradient(135deg, var(--accent) 0 12px, transparent 12px 24px); }
.hero-mark { position: absolute; inset-inline: 0; bottom: -0.12em; direction: ltr; text-align: center; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: clamp(140px, 30vw, 420px); line-height: .8; text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.08); white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; }
.topbar { padding-block: 18px; position: relative; z-index: 2; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; font-weight: 900; font-size: clamp(24px, 6vw, 34px); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; line-height: 1; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
:root[dir="rtl"] .brand { font-family: 'Big Shoulders Display', 'Cairo', sans-serif; }
.brand i { width: 12px; height: 12px; background: var(--accent); display: inline-block; flex: none; }
.nav { display: flex; align-items: center; gap: 20px; }
.nav a:not(.btn) { text-decoration: none; font-weight: 600; font-size: 15px; color: var(--deep-muted); }
.nav a:not(.btn):hover { color: var(--deep-ink); }
.hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 48px; align-items: center; padding-top: 36px; }

.hero-facts li::before { content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; }
.offer { border: 2px solid var(--accent); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: rgba(7,16,13,.72); }

.ticker { background: var(--accent); color: var(--accent-ink); overflow: hidden; border-block: 2px solid var(--ink); direction: ltr; }
.ticker-track { display: flex; width: max-content; animation: tick 32s linear infinite; }

.ticker span::after { content: "/"; margin-inline-start: 52px; opacity: .6; }
@keyframes tick { to { transform: translateX(-50%); } }

section { padding-block: 80px; }
.section-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; max-width: 760px; }
.section-head h2 { font-size: clamp(42px, 6.4vw, 76px); }
.section-head p { color: var(--muted); font-size: 18px; max-width: 56ch; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { padding: 26px 0 8px; padding-inline-end: 28px; border-top: 3px solid var(--accent); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.steps li::before { counter-increment: step; content: counter(step) " / 3"; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; color: var(--accent); }

.badge { position: absolute; top: -14px; inset-inline-start: 24px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 4px; font-weight: 500; }

.plan .btn { width: 100%; }

.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.results.single { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 56px; align-items: center; }
.tcard { margin: 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cmp { position: relative; aspect-ratio: 3 / 5; max-width: 100%; overflow: hidden; border-radius: 10px; background: var(--ph-a); --pos: 50%; touch-action: pan-y; user-select: none; -webkit-user-select: none; direction: ltr; }
.cmp-layer { position: absolute; inset: 0; }

.cmp-handle::after { content: "\2194"; position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #fff; color: #0E1F1B; display: grid; place-items: center; font-size: 20px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.4); }

.tag-b { left: 12px; }

.faq { display: flex; flex-direction: column; max-width: 800px; border-top: 3px solid var(--ink); }

.calc { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 30px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: start; }

.rev-form { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin-bottom: 32px; }

.follow { background: var(--accent); color: var(--accent-ink); padding-block: 40px; }
.follow .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.follow h2 { font-size: clamp(32px, 5vw, 54px); max-width: 16ch; }
.follow .row { display: flex; flex-wrap: wrap; gap: 12px; }
.follow .btn { border-color: var(--accent-ink); color: var(--accent-ink); }
.follow .btn:hover { background: var(--accent-ink); color: var(--accent); }

.join-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: start; }
.form { background: #FFFFFF; color: #0E1F1B; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; --ink: #0E1F1B; --muted: #475A54; --line: #D0D9D2; --accent: #D93A17; --accent-ink: #FFFFFF; --bg: #F1F4F0; --surface: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form { background: #141F1B; color: #EDF3EF; --surface: #141F1B; --ink: #EDF3EF; --muted: #9FB2AA; --line: #24352E; --accent: #FF6A3D; --accent-ink: #1A0A06; --bg: #0B1210; } }
:root[data-theme="dark"] .form { background: #141F1B; color: #EDF3EF; --surface: #141F1B; --ink: #EDF3EF; --muted: #9FB2AA; --line: #24352E; --accent: #FF6A3D; --accent-ink: #1A0A06; --bg: #0B1210; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field label, .field legend { font-weight: 600; font-size: 14px; padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
.input { font: 500 16px/1.3 var(--font-body); width: 100%; padding: 13px 14px; border-radius: 6px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
textarea.input { min-height: 90px; resize: vertical; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choices.two { grid-template-columns: repeat(2, 1fr); }
.choice { position: relative; min-width: 0; }
.choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.choice span { display: flex; flex-direction: column; gap: 2px; padding: 12px; border: 2px solid var(--line); border-radius: 6px; background: var(--bg); font-weight: 700; font-size: 15px; height: 100%; }
.choice span small { font-weight: 500; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.choice input:checked + span { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.err { color: var(--accent); font-size: 14px; font-weight: 600; min-height: 1.2em; }
.form .btn { border-color: var(--ink); color: var(--ink); }
.form .btn-primary { width: 100%; padding-block: 18px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.form-hint { font-size: 13px; color: var(--muted); }
.result { display: none; flex-direction: column; gap: 14px; border-top: 2px dashed var(--line); padding-top: 20px; }
.result.show { display: flex; }
.result h3 { font-size: 30px; }
.result p { color: var(--muted); font-size: 15px; }
.result textarea { min-height: 130px; font-size: 14px; }
.result .row { display: flex; flex-wrap: wrap; gap: 10px; }
.result .row .btn, .result .row .btn-primary { flex: 1 1 180px; width: auto; padding-block: 15px; }
.copied { font-size: 14px; font-weight: 600; color: var(--muted); min-height: 1.2em; }

.contact { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.contact h3 { font-size: 42px; }
.contact > p { color: var(--deep-muted); max-width: 40ch; }

        document.body.appendChild(tmp);
        copyText(it.value, function (s) { cb.textContent = s === "ok" ? t("copiedBtn") : t("copyBtn"); }, tmp);
        setTimeout(function () { if (tmp.parentNode) tmp.parentNode.removeChild(tmp); }, 3000);
      });
      act.appendChild(cb);
      row.appendChild(left); row.appendChild(act);
      cl.appendChild(row);
    });
  }

  function renderAll() {
    applyStatic();
    renderDynamic();
    $("result").classList.remove("show");
    $("form-err").textContent = "";
  }

  /* ---------- Language switch ---------- */
  $("lang-btn").addEventListener("click", function () {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("dadour-lang", lang); } catch (e) {}
    renderAll();
  });

  /* Hide the floating button while the join section is on screen */
  try {
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { $("fab").classList.toggle("hide", en.isIntersecting); });
      }, { threshold: 0.15 });
      io.observe($("join"));
    }
  } catch (e) {}

  /* ---------- Join form ---------- */
  var form = $("join-form");
  $("f-goal").addEventListener("change", function () { selGoal = Number(this.value); });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("f-name").value.trim();
    var err = $("form-err");
    if (!name) {
      err.textContent = t("fErr");
      $("f-name").focus();
      return;
    }
    err.textContent = "";
    var plan = S.plans[selPlan] || S.plans[defaultPlan];
    var goal = L(S.goals)[selGoal] || L(S.goals)[0];
    var notes = $("f-notes").value.trim();
    var via = form.querySelector('input[name="via"]:checked');
    lastChannel = via && via.value === "ig" ? "ig" : "wa";
    lastMsg = fill(t("msg"), {
      name: name, plan: L(plan.name), duration: L(plan.duration), price: money(plan.price), goal: goal,
      notes: notes ? fill(t("msgNotes"), { notes: notes }) : ""
    });
    $("result-text").value = lastMsg;
    var btn = $("send-btn");
    btn.setAttribute("data-channel", lastChannel);
    if (lastChannel === "ig") {
      btn.href = igDm;
      btn.textContent = t("openIg");
      $("result-help").textContent = t("helpIg");
    } else if (waReady) {
      btn.href = "https://wa.me/" + S.whatsappDigits + "?text=" + encodeURIComponent(lastMsg);
      btn.textContent = t("openWa");
      $("result-help").textContent = t("helpWa");
    }
    $("copied-msg").textContent = "";
    var r = $("result");
    r.classList.add("show");
    r.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  function statusText(s) { return s === "ok" ? t("copied") : (s === "fail" ? t("copyFail") : ""); }
  $("send-btn").addEventListener("click", function () {
    if (this.getAttribute("data-channel") === "ig") {
      copyText(lastMsg, function (s) { $("copied-msg").textContent = statusText(s); }, $("result-text"));
    }
  });
  $("copy-msg").addEventListener("click", function () {
    copyText($("result-text").value, function (s) { $("copied-msg").textContent = statusText(s); }, $("result-text"));
  });

  renderAll();
})();
</script>

</body></html>
